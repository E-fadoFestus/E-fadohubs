    <script>
      // Filter out benign Vite HMR websocket connection error in AI Studio sandboxed preview
      (function() {
        if (typeof window !== 'undefined') {
          const _origError = console.error;
          console.error = function(...args) {
            if (args[0] && typeof args[0] === 'string' && (args[0].includes('[vite] failed to connect to websocket') || args[0].startsWith('[vite]'))) {
              console.warn(...args);
              return;
            }
            _origError.apply(console, args);
          };
        }
      })();
    </script>
